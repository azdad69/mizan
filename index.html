<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIZAN</title>
    <link rel="stylesheet" href="stylle.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="photos/balance.png" alt="balance" width="55" height="65" />
        <h1>MIZAN</h1>
      </div>
      <p>Les prix des métaux précieux</p>
    </header>
    <section>
      <div class="golld">
        <div class="content">
          <div class="photo">
            <img src="photos/gold-bars.png" alt="gold" width="200" />
          </div>
          <div class="linfo">
            <h2>or</h2>
            <p>---</p>
            <p>USD / once</p>
          </div>
        </div>
        <div class="mise">
          <p>🕐 Derniere mise a jour : ---</p>
        </div>
      </div>
      <div class="golld">
        <div class="content">
          <div class="photo">
            <img src="photos/bars.png" alt="argent" />
          </div>
          <div class="linfo">
            <h2>argent</h2>
            <p>---</p>
            <p>USD / once</p>
          </div>
        </div>
        <div class="mise">
          <p>🕐 Derniere mise a jour : ---</p>
        </div>
      </div>
    </section>
    <section class="calcul">
      <div class="titr">
        <img src="photos/calculator.png" alt="calcul" width="45" />
        <h2>Calculateur de prix</h2>
      </div>
      <div class="opt">
        <select id="nwaa">
          <option value="gold">Or</option>
          <option value="silver">Argent</option>
        </select>
        <input type="number" id="quntity" placeholder="Quntité (once)" />
        <button id="btn">Calculer</button>
      </div>
    </section>
    <section class="history">
      <div class="titre">
        <img src="photos/signal.png" alt="reseux" width="45" />
        <h2>Historique des prix</h2>
      </div>
      <p>Aucune donnée disponible pour le moment.</p>
    </section>
    <footer>
      <p class="pragraph">MIZAN._.Prix en temps reel</p>
</footer>
  </body>
</html>
